logging.level.org.springframework.web=DEBUG
# SERVER
server.port=${APP_PORT}
server.ssl.enabled=true
server.ssl.key-store=${KEY_STORE_PATH}
server.ssl.key-store-password=${KEY_STORE_PASSWORD}
server.ssl.key-store-type=${KEY_STORE_TYPE}
server.ssl.key-alias=${KEY_STORE_ALIAS}

# API
my-bus.api.client=${BUS-API}

spring.jpa.show-sql=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_SCHEMA}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.initialize=true
spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

okta.oauth2.issuer:${AUTH0_DOMAIN}
okta.oauth2.audience:${AUTH0_AUDIENCE}

com.er7.mybus.api.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS}